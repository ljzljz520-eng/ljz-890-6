<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.svg">
  <title>老师登录 · 毕业班纪念站</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="login-wrap">
    <form class="login-card" id="login-form">
      <div style="text-align:center;font-size:42px">🎓</div>
      <h1>老师后台登录</h1>
      <p class="sub">毕业班纪念站 · 内容维护与回忆审核</p>
      <p class="login-err" id="err"></p>
      <label class="field"><span>账号</span>
        <input type="text" name="username" required autocomplete="username" value="teacher">
      </label>
      <label class="field"><span>密码</span>
        <input type="password" name="password" required autocomplete="current-password" placeholder="请输入老师密码">
      </label>
      <button class="btn" type="submit" id="login-btn">登 录</button>
      <p style="text-align:center;margin-top:18px;font-size:13px;color:var(--ink-soft)">
        <a href="/">← 返回公开纪念页</a>
      </p>
    </form>
  </div>
  <script src="/js/common.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    if (params.get('expired')) document.getElementById('err').textContent = '登录已过期，请重新登录';

    document.getElementById('login-form').addEventListener('submit', async e => {
      e.preventDefault();
      const f = e.target;
      const btn = document.getElementById('login-btn');
      btn.disabled = true; btn.textContent = '登录中…';
      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: f.username.value, password: f.password.value })
        });
        const d = await res.json().catch(() => null);
        if (!res.ok || !d || d.ok === false) throw new Error((d && d.error) || '登录失败');
        const next = params.get('next');
        location.href = next && next.startsWith('/') ? next : '/admin/';
      } catch (err) {
        document.getElementById('err').textContent = err.message;
        btn.disabled = false; btn.textContent = '登 录';
      }
    });
  </script>
</body>
</html>
